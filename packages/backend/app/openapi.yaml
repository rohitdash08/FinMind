openapi: 3.0.3
info:
  title: FinMind API
  version: 0.1.0
  description: API for budgeting, bills, reminders and insights
servers:
  - url: http://localhost:8000
tags:
  - name: Auth
  - name: Categories
  - name: Expenses
  - name: Bills
  - name: Reminders
  - name: Insights
  - name: Digest
paths:
  /auth/register:
    post:
      summary: Register user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
            example:
              email: user@example.com
              password: secret123
      responses:
        '201': { description: Created }
        '400':
          description: Email already used or missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "email already used" }
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
            example:
              email: user@example.com
              password: secret123
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invalid credentials" }
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Missing/invalid refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "Missing Authorization Header" }

  /categories:
    get:
      summary: List categories
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - { id: 1, name: Groceries }
                - { id: 2, name: Utilities }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create category
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
            example: { name: Subscriptions }
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "category already exists" }

  /expenses:
    get:
      summary: List expenses
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
              example:
                - { id: 10, amount: 12.5, currency: USD, category_id: 1, notes: Lunch, spent_at: 2025-08-10 }
                - { id: 11, amount: 49.0, currency: USD, category_id: 2, notes: "", spent_at: 2025-08-09 }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create expense
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExpense'
            example:
              amount: 12.5
              currency: USD
              category_id: 1
              description: Lunch
              date: 2025-08-10
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expenses/recurring:
    get:
      summary: List recurring expenses
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of recurring expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringExpense'
    post:
      summary: Create recurring expense
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecurringExpense'
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expenses/recurring/{recurringId}/generate:
    post:
      summary: Generate concrete expenses from recurring definition
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: recurringId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [through_date]
              properties:
                through_date: { type: string, format: date }
      responses:
        '200':
          description: Generated count
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: integer }

  /bills:
    get:
      summary: List bills
      tags: [Bills]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bill'
              example:
                - { id: 3, name: Internet, amount: 49.99, currency: USD, next_due_date: 2025-08-15, cadence: MONTHLY, channel_email: true, channel_whatsapp: false }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create bill
      tags: [Bills]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBill'
            example:
              name: Internet
              amount: 49.99
              currency: USD
              next_due_date: 2025-08-15
              cadence: MONTHLY
              channel_email: true
              channel_whatsapp: false
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bills/{billId}/pay:
    post:
      summary: Mark bill paid
      tags: [Bills]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: billId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
              example: { message: updated }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reminders:
    get:
      summary: List reminders
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reminder'
              example:
                - { id: 6, message: Pay credit card, send_at: 2025-08-11T10:00:00Z, sent: false, channel: email }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create reminder
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReminder'
            example:
              message: Pay credit card
              send_at: 2025-08-11T10:00:00Z
              channel: email
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reminders/run:
    post:
      summary: Process due reminders
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Processed count }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reminders/bills/{billId}/schedule:
    post:
      summary: Create bill reminders with default/override offsets
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: billId
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                offsets_days:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: Created reminders count
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }

  /reminders/bills/{billId}/autopay-result:
    post:
      summary: Emit autopay outcome follow-up reminders
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: billId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [SUCCESS, FAILED] }
      responses:
        '200':
          description: Created reminders count
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }

  /insights/budget-suggestion:
    get:
      summary: Get monthly budget suggestion
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: month
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Suggestion
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                month: 2025-08
                suggested_total: 1200
                method: gemini
                analytics:
                  month_over_month_change_pct: 5.5
                  current_month_expenses: 950
                  previous_month_expenses: 900
                breakdown:
                  needs: 600
                  wants: 360
                  savings: 240
                tips: ["Cap dining spend to 80% of last month", "Automate weekly transfer to savings"]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /digest/weekly:
    get:
      summary: Get weekly financial digest
      description: |
        Generate a comprehensive weekly financial summary with spending trends,
        category breakdowns, daily patterns, upcoming bills, and AI-powered insights.
      tags: [Digest]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: week
          required: false
          schema: { type: string, format: date }
          description: Week start date (YYYY-MM-DD). Will be normalized to Monday. Defaults to current week.
        - in: header
          name: X-Gemini-Api-Key
          required: false
          schema: { type: string }
          description: Optional user-provided Gemini API key for AI insights
        - in: header
          name: X-Insight-Persona
          required: false
          schema: { type: string }
          description: Optional custom persona for AI insights generation
      responses:
        '200':
          description: Weekly digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigest'
              example:
                period:
                  week_start: "2025-08-04"
                  week_end: "2025-08-10"
                  week_number: 32
                  year: 2025
                summary:
                  total_income: 2000.0
                  total_expenses: 450.0
                  net_flow: 1550.0
                  transaction_count: 12
                trends:
                  expense_change_pct: -15.5
                  income_change_pct: 0.0
                  expense_trend: decreasing
                  previous_week_expenses: 532.5
                  previous_week_income: 2000.0
                category_breakdown:
                  - category_id: 1
                    category_name: Food
                    amount: 200.0
                    transaction_count: 8
                    share_pct: 44.44
                daily_breakdown:
                  - date: "2025-08-04"
                    day_name: Mon
                    amount: 50.0
                    transaction_count: 2
                upcoming_bills:
                  items:
                    - id: 3
                      name: Internet
                      amount: 49.99
                      next_due_date: "2025-08-07"
                  total: 49.99
                  count: 1
                top_transactions:
                  - id: 45
                    description: Groceries
                    amount: 120.0
                    date: "2025-08-05"
                    category_name: Food
                insights:
                  insights:
                    - "Great job! Spending decreased 15% from last week."
                    - "Food remains your largest expense category."
                  highlight: "Positive week with healthy savings rate."
                  suggestion: "Consider meal prepping to reduce food costs further."
                meta:
                  method: heuristic
                  persona: "You are FinMind's weekly digest assistant..."
        '400':
          description: Invalid week format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "Invalid week format. Expected YYYY-MM-DD." }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /digest/weekly/summary:
    get:
      summary: Get condensed weekly summary
      description: |
        Get a lightweight weekly summary with just the key metrics and trends.
        Useful for dashboard widgets or quick notifications.
      tags: [Digest]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: week
          required: false
          schema: { type: string, format: date }
          description: Week start date (YYYY-MM-DD). Defaults to current week.
      responses:
        '200':
          description: Condensed weekly summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySummary'
              example:
                period:
                  week_start: "2025-08-04"
                  week_end: "2025-08-10"
                  week_number: 32
                  year: 2025
                summary:
                  total_income: 2000.0
                  total_expenses: 450.0
                  net_flow: 1550.0
                  transaction_count: 12
                trends:
                  expense_change_pct: -15.5
                  expense_trend: decreasing
                highlight: "Positive week with healthy savings rate."
        '400':
          description: Invalid week format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      example: { error: "invalid credentials" }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Expense:
      type: object
      properties:
        id: { type: integer }
        amount: { type: number, format: float }
        currency: { type: string }
        category_id: { type: integer }
        expense_type: { type: string }
        description: { type: string, nullable: true }
        date: { type: string, format: date }
    NewExpense:
      type: object
      required: [amount]
      properties:
        amount: { type: number, format: float }
        currency: { type: string, default: USD }
        category_id: { type: integer, nullable: true }
        expense_type: { type: string, default: EXPENSE }
        description: { type: string, nullable: true }
        date: { type: string, format: date, nullable: true }
    RecurringExpense:
      type: object
      properties:
        id: { type: integer }
        amount: { type: number, format: float }
        currency: { type: string }
        expense_type: { type: string }
        category_id: { type: integer, nullable: true }
        description: { type: string }
        cadence: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        active: { type: boolean }
    NewRecurringExpense:
      type: object
      required: [amount, description, cadence, start_date]
      properties:
        amount: { type: number, format: float }
        currency: { type: string, default: INR }
        expense_type: { type: string, default: EXPENSE }
        category_id: { type: integer, nullable: true }
        description: { type: string }
        cadence: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
    Bill:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        amount: { type: number, format: float }
        currency: { type: string }
        next_due_date: { type: string, format: date }
        cadence: { type: string, enum: [WEEKLY, MONTHLY, YEARLY, ONCE] }
        autopay_enabled: { type: boolean }
        channel_email: { type: boolean }
        channel_whatsapp: { type: boolean }
    NewBill:
      type: object
      required: [name, amount, next_due_date]
      properties:
        name: { type: string }
        amount: { type: number, format: float }
        currency: { type: string, default: USD }
        next_due_date: { type: string, format: date }
        cadence: { type: string, enum: [WEEKLY, MONTHLY, YEARLY, ONCE], default: MONTHLY }
        autopay_enabled: { type: boolean, default: false }
        channel_email: { type: boolean, default: true }
        channel_whatsapp: { type: boolean, default: false }
    Reminder:
      type: object
      properties:
        id: { type: integer }
        message: { type: string }
        send_at: { type: string, format: date-time }
        sent: { type: boolean }
        channel: { type: string, enum: [email, whatsapp] }
    NewReminder:
      type: object
      required: [message, send_at]
      properties:
        message: { type: string }
        send_at: { type: string, format: date-time }
        channel: { type: string, enum: [email, whatsapp], default: email }
    WeeklyDigest:
      type: object
      description: Comprehensive weekly financial digest
      properties:
        period:
          type: object
          properties:
            week_start: { type: string, format: date }
            week_end: { type: string, format: date }
            week_number: { type: integer }
            year: { type: integer }
        summary:
          type: object
          properties:
            total_income: { type: number, format: float }
            total_expenses: { type: number, format: float }
            net_flow: { type: number, format: float }
            transaction_count: { type: integer }
        trends:
          type: object
          properties:
            expense_change_pct: { type: number, format: float }
            income_change_pct: { type: number, format: float }
            expense_trend: { type: string, enum: [increasing, decreasing, stable] }
            previous_week_expenses: { type: number, format: float }
            previous_week_income: { type: number, format: float }
        category_breakdown:
          type: array
          items:
            type: object
            properties:
              category_id: { type: integer, nullable: true }
              category_name: { type: string }
              amount: { type: number, format: float }
              transaction_count: { type: integer }
              share_pct: { type: number, format: float }
        daily_breakdown:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              day_name: { type: string }
              amount: { type: number, format: float }
              transaction_count: { type: integer }
        upcoming_bills:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Bill'
            total: { type: number, format: float }
            count: { type: integer }
        top_transactions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              description: { type: string }
              amount: { type: number, format: float }
              date: { type: string, format: date }
              category_name: { type: string }
              currency: { type: string }
        insights:
          type: object
          properties:
            insights:
              type: array
              items: { type: string }
            highlight: { type: string }
            suggestion: { type: string }
        meta:
          type: object
          properties:
            method: { type: string, enum: [heuristic, gemini] }
            persona: { type: string }
        warnings:
          type: array
          items: { type: string }
    WeeklySummary:
      type: object
      description: Condensed weekly summary
      properties:
        period:
          type: object
          properties:
            week_start: { type: string, format: date }
            week_end: { type: string, format: date }
            week_number: { type: integer }
            year: { type: integer }
        summary:
          type: object
          properties:
            total_income: { type: number, format: float }
            total_expenses: { type: number, format: float }
            net_flow: { type: number, format: float }
            transaction_count: { type: integer }
        trends:
          type: object
          properties:
            expense_change_pct: { type: number, format: float }
            income_change_pct: { type: number, format: float }
            expense_trend: { type: string, enum: [increasing, decreasing, stable] }
        highlight: { type: string }
