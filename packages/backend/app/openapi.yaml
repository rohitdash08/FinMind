openapi: "3.0.3"
info:
  title: FinMind API
  version: "1.0.0"
  description: Personal finance backend API with smart digests, expenses, bills, accounts, and AI-powered insights.

servers:
  - url: /api
    description: Local dev

paths:
  /digests/weekly:
    get:
      summary: Weekly financial digest
      description: Returns or generates the weekly digest for the current or specified week.
      tags: [Digests]
      security:
        - BearerAuth: []
      parameters:
        - name: week
          in: query
          required: false
          schema:
            type: string
            format: date
          description: "ISO date (YYYY-MM-DD) falling within the desired week. Defaults to the current week."
      responses:
        "200":
          description: Weekly digest object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyDigest"
        "400":
          description: Invalid week parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /digests/history:
    get:
      summary: List past weekly digests
      description: Returns a list of previously generated weekly digests, newest first.
      tags: [Digests]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 52
      responses:
        "200":
          description: Array of weekly digests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyDigest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    WeeklyDigest:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        total_income:
          type: number
          format: float
        total_expenses:
          type: number
          format: float
        net_savings:
          type: number
          format: float
        top_category:
          type: string
          nullable: true
        top_expense_amount:
          type: number
          format: float
        bills_due_count:
          type: integer
        bills_paid_count:
          type: integer
        savings_goal_progress:
          type: object
          nullable: true
          description: "JSON object with savings goal progress data"
        summary_text:
          type: string
          nullable: true
        wow_expense_change_pct:
          type: number
          format: float
          nullable: true
          description: "Week-over-week expense change percentage"
        generated_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
