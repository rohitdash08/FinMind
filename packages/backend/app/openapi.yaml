openapi: 3.0.3
info:
  title: FinMind API
  version: 0.1.0
  description: API for budgeting, bills, reminders and insights
servers:
  - url: http://localhost:8000
tags:
  - name: Auth
  - name: Categories
  - name: Expenses
  - name: Bills
  - name: Reminders
  - name: Digest
  - name: Insights
paths:
  /auth/register:
    post:
      summary: Register user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
            example:
              email: user@example.com
              password: secret123
      responses:
        '201': { description: Created }
        '400':
          description: Email already used or missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "email already used" }
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
            example:
              email: user@example.com
              password: secret123
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invalid credentials" }
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Missing/invalid refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "Missing Authorization Header" }

  /categories:
    get:
      summary: List categories
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - { id: 1, name: Groceries }
                - { id: 2, name: Utilities }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create category
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
            example: { name: Subscriptions }
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "category already exists" }

  /expenses:
    get:
      summary: List expenses
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
              example:
                - { id: 10, amount: 12.5, currency: USD, category_id: 1, notes: Lunch, spent_at: 2025-08-10 }
                - { id: 11, amount: 49.0, currency: USD, category_id: 2, notes: "", spent_at: 2025-08-09 }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create expense
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExpense'
            example:
              amount: 12.5
              currency: USD
              category_id: 1
              description: Lunch
              date: 2025-08-10
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expenses/recurring:
    get:
      summary: List recurring expenses
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of recurring expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringExpense'
    post:
      summary: Create recurring expense
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecurringExpense'
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expenses/recurring/{recurringId}/generate:
    post:
      summary: Generate concrete expenses from recurring definition
      tags: [Expenses]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: recurringId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [through_date]
              properties:
                through_date: { type: string, format: date }
      responses:
        '200':
          description: Generated count
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: integer }

  /bills:
    get:
      summary: List bills
      tags: [Bills]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bill'
              example:
                - { id: 3, name: Internet, amount: 49.99, currency: USD, next_due_date: 2025-08-15, cadence: MONTHLY, channel_email: true, channel_whatsapp: false }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create bill
      tags: [Bills]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBill'
            example:
              name: Internet
              amount: 49.99
              currency: USD
              next_due_date: 2025-08-15
              cadence: MONTHLY
              channel_email: true
              channel_whatsapp: false
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bills/{billId}/pay:
    post:
      summary: Mark bill paid
      tags: [Bills]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: billId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
              example: { message: updated }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reminders:
    get:
      summary: List reminders
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reminder'
              example:
                - { id: 6, message: Pay credit card, send_at: 2025-08-11T10:00:00Z, sent: false, channel: email }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create reminder
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReminder'
            example:
              message: Pay credit card
              send_at: 2025-08-11T10:00:00Z
              channel: email
      responses:
        '201': { description: Created }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reminders/run:
    post:
      summary: Process due reminders
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Processed count }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reminders/bills/{billId}/schedule:
    post:
      summary: Create bill reminders with default/override offsets
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: billId
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                offsets_days:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: Created reminders count
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }

  /reminders/bills/{billId}/autopay-result:
    post:
      summary: Emit autopay outcome follow-up reminders
      tags: [Reminders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: billId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [SUCCESS, FAILED] }
      responses:
        '200':
          description: Created reminders count
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }

  /digest/weekly:
    get:
      summary: Weekly financial digest
      description: >
        Returns a comprehensive weekly financial summary including income/expense
        totals, category breakdown, daily spending trend, top transactions,
        upcoming bills, and AI-powered or heuristic insights.
      tags: [Digest]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: week
          required: false
          schema: { type: string, pattern: '^\d{4}-W\d{1,2}$' }
          description: ISO week in YYYY-Www format (e.g. 2026-W14). Defaults to current week.
        - in: header
          name: X-Gemini-Api-Key
          required: false
          schema: { type: string }
          description: Optional user-supplied Gemini API key for AI insights.
        - in: header
          name: X-Insight-Persona
          required: false
          schema: { type: string }
          description: Optional custom AI persona prompt.
      responses:
        '200':
          description: Weekly digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigest'
              example:
                period:
                  iso_year: 2026
                  iso_week: 14
                  start_date: "2026-03-30"
                  end_date: "2026-04-05"
                summary:
                  total_income: 5000.00
                  total_expenses: 1200.00
                  net_flow: 3800.00
                  week_over_week_change_pct: -10.5
                  upcoming_bills_total: 149.98
                  upcoming_bills_count: 2
                category_breakdown:
                  - { category_id: 1, category_name: Food, amount: 450.00, share_pct: 37.5 }
                  - { category_id: 2, category_name: Transport, amount: 300.00, share_pct: 25.0 }
                daily_spending:
                  - { date: "2026-03-30", amount: 150.00 }
                  - { date: "2026-03-31", amount: 200.00 }
                top_transactions:
                  - { id: 42, amount: 300.00, description: Groceries, date: "2026-03-30", category_id: 1, currency: INR }
                upcoming_bills:
                  - { id: 5, name: Internet, amount: 49.99, currency: INR, due_date: "2026-04-01" }
                insights:
                  highlights:
                    - "Positive cash flow: earned 5000.00, spent 1200.00."
                    - "Spending decreased 10.5% vs last week."
                  risk_flag: null
                  saving_tip: "Consider setting a budget cap on 'Food' to reduce spending by 10-15%."
                method: heuristic
        '400':
          description: Invalid week parameter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /insights/budget-suggestion:
    get:
      summary: Get monthly budget suggestion
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: month
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Suggestion
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                month: 2025-08
                suggested_total: 1200
                method: gemini
                analytics:
                  month_over_month_change_pct: 5.5
                  current_month_expenses: 950
                  previous_month_expenses: 900
                breakdown:
                  needs: 600
                  wants: 360
                  savings: 240
                tips: ["Cap dining spend to 80% of last month", "Automate weekly transfer to savings"]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      example: { error: "invalid credentials" }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Expense:
      type: object
      properties:
        id: { type: integer }
        amount: { type: number, format: float }
        currency: { type: string }
        category_id: { type: integer }
        expense_type: { type: string }
        description: { type: string, nullable: true }
        date: { type: string, format: date }
    NewExpense:
      type: object
      required: [amount]
      properties:
        amount: { type: number, format: float }
        currency: { type: string, default: USD }
        category_id: { type: integer, nullable: true }
        expense_type: { type: string, default: EXPENSE }
        description: { type: string, nullable: true }
        date: { type: string, format: date, nullable: true }
    RecurringExpense:
      type: object
      properties:
        id: { type: integer }
        amount: { type: number, format: float }
        currency: { type: string }
        expense_type: { type: string }
        category_id: { type: integer, nullable: true }
        description: { type: string }
        cadence: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        active: { type: boolean }
    NewRecurringExpense:
      type: object
      required: [amount, description, cadence, start_date]
      properties:
        amount: { type: number, format: float }
        currency: { type: string, default: INR }
        expense_type: { type: string, default: EXPENSE }
        category_id: { type: integer, nullable: true }
        description: { type: string }
        cadence: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
    Bill:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        amount: { type: number, format: float }
        currency: { type: string }
        next_due_date: { type: string, format: date }
        cadence: { type: string, enum: [WEEKLY, MONTHLY, YEARLY, ONCE] }
        autopay_enabled: { type: boolean }
        channel_email: { type: boolean }
        channel_whatsapp: { type: boolean }
    NewBill:
      type: object
      required: [name, amount, next_due_date]
      properties:
        name: { type: string }
        amount: { type: number, format: float }
        currency: { type: string, default: USD }
        next_due_date: { type: string, format: date }
        cadence: { type: string, enum: [WEEKLY, MONTHLY, YEARLY, ONCE], default: MONTHLY }
        autopay_enabled: { type: boolean, default: false }
        channel_email: { type: boolean, default: true }
        channel_whatsapp: { type: boolean, default: false }
    Reminder:
      type: object
      properties:
        id: { type: integer }
        message: { type: string }
        send_at: { type: string, format: date-time }
        sent: { type: boolean }
        channel: { type: string, enum: [email, whatsapp] }
    NewReminder:
      type: object
      required: [message, send_at]
      properties:
        message: { type: string }
        send_at: { type: string, format: date-time }
        channel: { type: string, enum: [email, whatsapp], default: email }
    WeeklyDigest:
      type: object
      properties:
        period:
          type: object
          properties:
            iso_year: { type: integer }
            iso_week: { type: integer }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
        summary:
          type: object
          properties:
            total_income: { type: number, format: float }
            total_expenses: { type: number, format: float }
            net_flow: { type: number, format: float }
            week_over_week_change_pct: { type: number, format: float }
            upcoming_bills_total: { type: number, format: float }
            upcoming_bills_count: { type: integer }
        category_breakdown:
          type: array
          items:
            type: object
            properties:
              category_id: { type: integer, nullable: true }
              category_name: { type: string }
              amount: { type: number, format: float }
              share_pct: { type: number, format: float }
        daily_spending:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              amount: { type: number, format: float }
        top_transactions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              amount: { type: number, format: float }
              description: { type: string }
              date: { type: string, format: date }
              category_id: { type: integer, nullable: true }
              currency: { type: string }
        upcoming_bills:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              amount: { type: number, format: float }
              currency: { type: string }
              due_date: { type: string, format: date }
        insights:
          type: object
          properties:
            highlights:
              type: array
              items: { type: string }
            risk_flag: { type: string, nullable: true }
            saving_tip: { type: string }
        method: { type: string, enum: [gemini, heuristic] }
        persona: { type: string }
        warnings:
          type: array
          items: { type: string }
