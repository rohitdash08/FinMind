app = "finmind"
primary_region = "iad"

[build]
  dockerfile = "packages/backend/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    path = "/health"
    timeout = "5s"

[env]
  LOG_LEVEL = "INFO"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
