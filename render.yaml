services:
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    dockerContext: packages/backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: finmind-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
    startCommand: "sh -c 'python -m flask --app wsgi:app init-db && gunicorn --workers=2 --threads=4 --bind 0.0.0.0:8000 wsgi:app'"

  - type: web
    name: finmind-frontend
    runtime: docker
    dockerfilePath: app/Dockerfile
    dockerContext: app
    plan: starter
    envVars:
      - key: BACKEND_URL
        value: https://finmind-backend.onrender.com
        # Public URL of the backend service.
        # The frontend Docker entrypoint injects this as
        # window.__FINMIND_API_URL__ so the browser can reach the API.
        # If Render renames the backend (e.g., adds a suffix),
        # update this value to match.

  - type: keyvalue
    name: finmind-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: finmind-db
    plan: starter
    databaseName: finmind
    user: finmind
