services:
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    dockerContext: packages/backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
        # TODO: Replace with your actual Redis URL.
        # Create a Redis instance via the Render dashboard (Add-ons → Redis)
        # or use an external provider like Upstash (free tier available),
        # then paste the connection string here.
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
    startCommand: "sh -c 'python -m flask --app wsgi:app init-db && gunicorn --workers=2 --threads=4 --bind 0.0.0.0:8000 wsgi:app'"

  - type: web
    name: finmind-frontend
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: app/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: finmind-db
    plan: starter
    databaseName: finmind
    user: finmind

  # Redis: Use Render's Redis add-on from the dashboard,
  # or an external provider like Upstash. Set REDIS_URL on the backend service.
