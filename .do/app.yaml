spec:
  name: finmind
  region: nyc
  services:
    - name: backend
      dockerfile_path: packages/backend/Dockerfile
      github:
        repo: rohitdash08/FinMind
        branch: main
        deploy_on_push: true
      http_port: 8000
      instance_count: 1
      instance_size_slug: basic-xxs
      routes:
        - path: /api
        - path: /health
      health_check:
        http_path: /health
        initial_delay_seconds: 10
        period_seconds: 10
      run_command: |
        sh -c "python -m flask --app wsgi:app init-db && gunicorn --workers=2 --threads=4 --bind 0.0.0.0:8000 wsgi:app"
      envs:
        - key: DATABASE_URL
          scope: RUN_TIME
          value: ${db.DATABASE_URL}
        - key: REDIS_URL
          scope: RUN_TIME
          value: CHANGE_ME_SET_EXTERNAL_REDIS_URL
        - key: JWT_SECRET
          scope: RUN_TIME
          type: SECRET
          value: change-me
        - key: LOG_LEVEL
          scope: RUN_TIME
          value: INFO
        - key: GEMINI_MODEL
          scope: RUN_TIME
          value: gemini-1.5-flash

    - name: frontend
      dockerfile_path: app/Dockerfile
      github:
        repo: rohitdash08/FinMind
        branch: main
        deploy_on_push: true
      http_port: 80
      instance_count: 1
      instance_size_slug: basic-xxs
      routes:
        - path: /

  databases:
    - name: db
      engine: PG
      version: "16"
      size: db-s-dev-database
      num_nodes: 1

  # Note: DigitalOcean App Platform doesn't have managed Redis.
  # Use DigitalOcean Managed Redis or Upstash, then set REDIS_URL on the backend service.
