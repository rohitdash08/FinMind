spec:
  name: finmind
  region: nyc
  services:
    - name: backend
      dockerfile_path: packages/backend/Dockerfile
      source_dir: packages/backend
      http_port: 8000
      instance_count: 1
      instance_size_slug: basic-xxs
      routes:
        - path: /api
      health_check:
        http_path: /health
      envs:
        - key: DATABASE_URL
          scope: RUN_TIME
          value: ${db.DATABASE_URL}
        - key: REDIS_URL
          scope: RUN_TIME
          value: ${redis.REDIS_URL}
        - key: JWT_SECRET
          scope: RUN_TIME
          type: SECRET
          value: CHANGE_ME
        - key: GEMINI_API_KEY
          scope: RUN_TIME
          type: SECRET
          value: ""
        - key: LOG_LEVEL
          scope: RUN_TIME
          value: INFO

    - name: frontend
      dockerfile_path: app/Dockerfile
      source_dir: app
      http_port: 80
      instance_count: 1
      instance_size_slug: basic-xxs
      routes:
        - path: /

  databases:
    - engine: PG
      name: db
      version: "16"

  workers: []
  jobs: []
