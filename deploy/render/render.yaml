databases:
  - name: finmind-db
    plan: starter
    databaseName: finmind
    user: finmind
    ipAllowList: []

services:
  - type: redis
    name: finmind-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: finmind-api
    plan: starter
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finmind-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: FLASK_APP
        value: wsgi:app
    buildCommand: ""
    startCommand: "sh -c 'python -m flask --app wsgi:app init-db && gunicorn -w 2 -k gthread -b 0.0.0.0:$PORT wsgi:app'"

  - type: web
    name: finmind-web
    plan: starter
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: app
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: finmind-api
          envVarKey: RENDER_EXTERNAL_URL
