# Default values for FinMind Helm Chart

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Backend configuration
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/rohitdash08/finmind-backend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  env:
    LOG_LEVEL: INFO
    GEMINI_MODEL: gemini-1.5-flash
  
  # Probes
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 20
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10

# Frontend configuration (optional - deploy separately to Vercel/Netlify)
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/rohitdash08/finmind-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.finmind.example.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
  tls:
    - secretName: finmind-tls
      hosts:
        - api.finmind.example.com

# Secrets (provide via --set or external secret management)
secrets:
  jwtSecret: ""  # Required: generate with `openssl rand -hex 32`
  geminiApiKey: ""  # Optional

# PostgreSQL subchart configuration
postgresql:
  enabled: true
  auth:
    username: finmind
    password: ""  # Set via --set postgresql.auth.password=xxx
    database: finmind
  primary:
    persistence:
      size: 10Gi
  metrics:
    enabled: true

# Redis subchart configuration
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi
  metrics:
    enabled: true

# Monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: false  # Enable if Prometheus Operator is installed
    interval: 30s

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network policies
networkPolicy:
  enabled: false

# Service account
serviceAccount:
  create: true
  name: finmind
  annotations: {}
