# -- Global overrides
global:
  # -- Namespace for all FinMind resources
  namespace: finmind

# -----------------------------------------------------------------------------
# Backend (Flask / Gunicorn)
# -----------------------------------------------------------------------------
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/rohitdash08/finmind-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  probes:
    liveness:
      path: /health
      port: 8000
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      port: 8000
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# Frontend (React / Nginx)
# -----------------------------------------------------------------------------
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/rohitdash08/finmind-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  probes:
    liveness:
      path: /
      port: 80
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /
      port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------
postgresql:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

# -----------------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------------
redis:
  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: finmind.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: finmind-tls
      hosts:
        - finmind.example.com

# -----------------------------------------------------------------------------
# Secrets  (base64-encoded defaults — override in production!)
# -----------------------------------------------------------------------------
secrets:
  postgresUser: ZmlubWluZA==            # finmind
  postgresPassword: Y2hhbmdlbWU=        # changeme
  postgresDb: ZmlubWluZA==              # finmind
  jwtSecret: c3VwZXItc2VjcmV0LWp3dA==  # super-secret-jwt
  geminiApiKey: ""
  openaiApiKey: ""

# -----------------------------------------------------------------------------
# ConfigMap
# -----------------------------------------------------------------------------
config:
  logLevel: INFO
  geminiModel: gemini-2.0-flash
  redisUrl: redis://finmind-redis:6379/0
  # DATABASE_URL is constructed from secret values at runtime

# -----------------------------------------------------------------------------
# Image pull secrets (if using private registries)
# -----------------------------------------------------------------------------
imagePullSecrets: []

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: false
  name: ""
  annotations: {}
