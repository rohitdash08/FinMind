## Global settings
global:
  namespace: finmind
  imagePullPolicy: IfNotPresent

## Backend (Flask)
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/rohitdash08/finmind-backend
    tag: latest
    pullPolicy: IfNotPresent
  port: 8000
  command:
    - sh
    - -c
    - |
      python -m flask --app wsgi:app init-db && \
      export PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc && \
      rm -rf $PROMETHEUS_MULTIPROC_DIR && \
      mkdir -p $PROMETHEUS_MULTIPROC_DIR && \
      gunicorn --workers=2 --threads=4 --bind 0.0.0.0:8000 wsgi:app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 20
  service:
    type: ClusterIP
    port: 8000

## Frontend (React + Nginx)
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/rohitdash08/finmind-frontend
    tag: latest
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80

## Nginx reverse proxy
nginx:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: 1.27-alpine
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80
  # Nginx config is generated in the template with proper service discovery

## PostgreSQL
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

## Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

## Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: finmind.example.com
      paths:
        - path: /
          pathType: Prefix
          service: nginx
          port: 80
    - host: api.finmind.example.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
          port: 8000
  tls:
    - secretName: finmind-tls
      hosts:
        - finmind.example.com
        - api.finmind.example.com

## HPA (Horizontal Pod Autoscaler)
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

## Network Policies (restrict pod-to-pod traffic)
networkPolicy:
  enabled: false

## ConfigMap
config:
  LOG_LEVEL: INFO
  GEMINI_MODEL: gemini-1.5-flash
  # REDIS_URL is computed in the template via the finmind.redisUrl helper

## Secrets — set via --set or external-secrets
secrets:
  POSTGRES_USER: finmind
  POSTGRES_PASSWORD: change-me-strong
  POSTGRES_DB: finmind
  JWT_SECRET: change-me-long-random-secret
  GEMINI_API_KEY: ""
  GRAFANA_ADMIN_USER: finmind_admin
  GRAFANA_ADMIN_PASSWORD: change-me-admin-password

## External Secrets (optional, overrides secrets above)
externalSecrets:
  enabled: false
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  remoteRefs:
    POSTGRES_USER: finmind/postgres-user
    POSTGRES_PASSWORD: finmind/postgres-password
    POSTGRES_DB: finmind/postgres-db
    JWT_SECRET: finmind/jwt-secret
    GEMINI_API_KEY: finmind/gemini-api-key
    GRAFANA_ADMIN_USER: finmind/grafana-admin-user
    GRAFANA_ADMIN_PASSWORD: finmind/grafana-admin-password

## Monitoring
monitoring:
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.54.1
    retention:
      time: 14d
      size: 1GB
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  grafana:
    enabled: true
    image:
      repository: grafana/grafana-oss
      tag: 11.1.5
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""
    ingress:
      enabled: true
      host: grafana.finmind.example.com
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi

  loki:
    enabled: true
    image:
      repository: grafana/loki
      tag: 2.9.10
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi

  promtail:
    enabled: true
    image:
      repository: grafana/promtail
      tag: 3.0.0
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  exporters:
    nodeExporter:
      enabled: true
      image:
        repository: quay.io/prometheus/node-exporter
        tag: v1.8.2
    postgresExporter:
      enabled: true
      image:
        repository: quay.io/prometheuscommunity/postgres-exporter
        tag: v0.16.0
    redisExporter:
      enabled: true
      image:
        repository: oliver006/redis_exporter
        tag: v1.63.0
    nginxExporter:
      enabled: true
      image:
        repository: nginx/nginx-prometheus-exporter
        tag: 1.3.0
