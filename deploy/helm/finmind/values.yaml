# FinMind Helm Chart - Default Values

global:
  namespace: finmind
  imagePullPolicy: IfNotPresent

# -- Backend configuration
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/rohitdash08/finmind-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  healthCheck:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  env:
    LOG_LEVEL: INFO
    GEMINI_MODEL: gemini-1.5-flash

# -- Frontend configuration
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/rohitdash08/finmind-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 70

# -- PostgreSQL configuration
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# -- Redis configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: "7"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Nginx reverse proxy
nginx:
  enabled: true
  image:
    repository: nginx
    tag: 1.27-alpine
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80

# -- Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: finmind.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: finmind-tls
      hosts:
        - finmind.example.com

# -- Secrets (override via --set or external secret manager)
secrets:
  postgresUser: finmind
  postgresPassword: changeme-in-production
  postgresDb: finmind
  jwtSecret: changeme-in-production
  geminiApiKey: ""

# -- Observability
monitoring:
  enabled: true
  prometheus:
    enabled: true
    scrapeInterval: 15s
  serviceMonitor:
    enabled: false

# -- Network policies
networkPolicy:
  enabled: true

# -- Pod disruption budgets
podDisruptionBudget:
  enabled: true
  backend:
    minAvailable: 1
  frontend:
    minAvailable: 1
