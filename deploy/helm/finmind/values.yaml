# =============================================================================
# FinMind — Helm Chart Default Values
# =============================================================================
# Override these via --set flags or a custom values-<env>.yaml file.
# Secrets should be provided via --set or external secret managers, never
# committed to source control.
# =============================================================================

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
global:
  # Container image registry prefix (e.g. ghcr.io/rohitdash08)
  imageRegistry: ""
  # Pull secrets for private registries
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Backend (Flask + Gunicorn)
# ---------------------------------------------------------------------------
backend:
  replicaCount: 2

  image:
    repository: ghcr.io/rohitdash08/finmind-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  # Resource requests and limits tuned for production
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Environment variables from ConfigMap (non-sensitive)
  config:
    LOG_LEVEL: "INFO"
    GEMINI_MODEL: "gemini-1.5-flash"
    GUNICORN_WORKERS: "2"
    GUNICORN_THREADS: "4"

  # Probes use the /health endpoint defined in the Flask app
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30

  # Pod disruption budget for zero-downtime deployments
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# ---------------------------------------------------------------------------
# Frontend (React SPA on nginx)
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 2

  image:
    repository: ghcr.io/rohitdash08/finmind-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    httpGet:
      path: /nginx-health
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 15

  readinessProbe:
    httpGet:
      path: /nginx-health
      port: 80
    initialDelaySeconds: 3
    periodSeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
postgresql:
  # Set to false to use an external managed database
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"

  auth:
    # These are defaults — override in production via --set or secrets
    username: finmind
    password: ""  # MUST be set at deploy time
    database: finmind

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""  # Use cluster default
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ---------------------------------------------------------------------------
# Redis
# ---------------------------------------------------------------------------
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"

  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  config:
    maxmemory: "128mb"
    maxmemoryPolicy: "allkeys-lru"

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    # cert-manager TLS automation
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # Proxy body size for file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
  hosts:
    - host: finmind.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /health
          pathType: Exact
          service: backend
  tls:
    - secretName: finmind-tls
      hosts:
        - finmind.example.com

# ---------------------------------------------------------------------------
# Secrets — provide at deploy time, never commit real values
# ---------------------------------------------------------------------------
secrets:
  # Database
  POSTGRES_USER: finmind
  POSTGRES_PASSWORD: ""     # --set secrets.POSTGRES_PASSWORD=<value>
  POSTGRES_DB: finmind
  # Auth
  JWT_SECRET: ""            # --set secrets.JWT_SECRET=<value>
  # AI services (optional)
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  # Notifications (optional)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_WHATSAPP_FROM: ""
  EMAIL_FROM: ""
  SMTP_URL: ""

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
namespace: finmind

# ---------------------------------------------------------------------------
# Service Account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: finmind
  annotations: {}
