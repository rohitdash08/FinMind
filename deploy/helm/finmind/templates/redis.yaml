{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finmind.fullname" . }}-redis
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "finmind.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "finmind.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finmind.fullname" . }}-redis
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "finmind.fullname" . }}-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
