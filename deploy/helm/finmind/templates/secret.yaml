apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finmind.fullname" . }}-secrets
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "finmind.databaseUrl" . | quote }}
  REDIS_URL: {{ include "finmind.redisUrl" . | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
