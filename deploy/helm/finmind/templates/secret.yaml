apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finmind.fullname" . }}-secrets
  namespace: {{ .Values.namespaceOverride }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  JWT_SECRET: {{ .Values.backend.secret.jwtSecret | quote }}
  GEMINI_API_KEY: {{ .Values.backend.secret.geminiApiKey | quote }}
  {{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
  GRAFANA_ADMIN_USER: {{ .Values.monitoring.grafana.adminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.monitoring.grafana.adminPassword | quote }}
  {{- end }}
