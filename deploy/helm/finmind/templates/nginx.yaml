apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ include "finmind.namespace" . }}
  labels:
    {{- include "finmind.nginx.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream backend {
      server backend:{{ .Values.backend.service.port }};
    }

    server {
      listen 80;
      server_name _;

      # Security headers
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

      # API proxy
      location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
      }

      # Prometheus metrics passthrough
      location /metrics {
        proxy_pass http://backend;
        proxy_http_version 1.1;
      }

      # Nginx status for monitoring
      location /nginx_status {
        stub_status;
        allow all;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ include "finmind.namespace" . }}
  labels:
    {{- include "finmind.nginx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        {{- include "finmind.nginx.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "finmind.serviceAccountName" . }}
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /nginx_status
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx_status
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ include "finmind.namespace" . }}
  labels:
    {{- include "finmind.nginx.labels" . | nindent 4 }}
spec:
  selector:
    app: nginx
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: 80
      protocol: TCP
