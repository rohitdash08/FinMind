# FinMind Secrets
apiVersion: v1
kind: Secret
metadata:
  name: finmind-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.secrets.POSTGRES_DB | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
---
# FinMind ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: finmind-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  GEMINI_MODEL: {{ .Values.backend.env.GEMINI_MODEL | quote }}
  REDIS_URL: "redis://redis:6379/0"
  GUNICORN_WORKERS: {{ .Values.backend.env.GUNICORN_WORKERS | quote }}
  GUNICORN_THREADS: {{ .Values.backend.env.GUNICORN_THREADS | quote }}
