# =============================================================================
# FinMind — Backend Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finmind.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
    {{- include "finmind.selectorLabels" (dict "component" "backend" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "finmind.selectorLabels" (dict "component" "backend" "context" .) | nindent 4 }}
