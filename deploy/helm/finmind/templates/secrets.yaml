apiVersion: v1
kind: Secret
metadata:
  name: finmind-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | default "finmind" | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgres.database | quote }}
  JWT_SECRET: {{ .Values.secrets.jwt.secret | default (randAlphaNum 32) | quote }}
  GRAFANA_ADMIN_USER: {{ .Values.monitoring.grafana.adminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafana.adminPassword | default (randAlphaNum 16) | quote }}
  {{- if .Values.secrets.gemini.apiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.gemini.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openai.apiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.twilio.accountSid }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.twilio.accountSid | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.twilio.authToken | quote }}
  TWILIO_WHATSAPP_FROM: {{ .Values.secrets.twilio.whatsappFrom | quote }}
  {{- end }}
  {{- if .Values.secrets.smtp.url }}
  SMTP_URL: {{ .Values.secrets.smtp.url | quote }}
  EMAIL_FROM: {{ .Values.secrets.smtp.emailFrom | quote }}
  {{- end }}
