# =============================================================================
# FinMind — Secrets
# =============================================================================
# WARNING: In production, use an external secret manager (Vault, AWS Secrets
# Manager, GCP Secret Manager) or Sealed Secrets instead of this resource.
# This template exists for initial setup and development environments.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finmind.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.POSTGRES_PASSWORD must be set" .Values.secrets.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.secrets.POSTGRES_DB | quote }}
  JWT_SECRET: {{ required "secrets.JWT_SECRET must be set" .Values.secrets.JWT_SECRET | quote }}
  {{- if .Values.secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | quote }}
  {{- end }}
  {{- if .Values.secrets.OPENAI_API_KEY }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  {{- end }}
  {{- if .Values.secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.TWILIO_ACCOUNT_SID | quote }}
  {{- end }}
  {{- if .Values.secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.TWILIO_AUTH_TOKEN | quote }}
  {{- end }}
  {{- if .Values.secrets.TWILIO_WHATSAPP_FROM }}
  TWILIO_WHATSAPP_FROM: {{ .Values.secrets.TWILIO_WHATSAPP_FROM | quote }}
  {{- end }}
  {{- if .Values.secrets.EMAIL_FROM }}
  EMAIL_FROM: {{ .Values.secrets.EMAIL_FROM | quote }}
  {{- end }}
  {{- if .Values.secrets.SMTP_URL }}
  SMTP_URL: {{ .Values.secrets.SMTP_URL | quote }}
  {{- end }}
