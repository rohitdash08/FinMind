{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.twilioAccountSid }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.twilioAccountSid | quote }}
  {{- end }}
  {{- if .Values.secrets.twilioAuthToken }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.twilioAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.twilioWhatsappFrom }}
  TWILIO_WHATSAPP_FROM: {{ .Values.secrets.twilioWhatsappFrom | quote }}
  {{- end }}
  {{- if .Values.secrets.emailFrom }}
  EMAIL_FROM: {{ .Values.secrets.emailFrom | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpUrl }}
  SMTP_URL: {{ .Values.secrets.smtpUrl | quote }}
  {{- end }}
{{- end }}
