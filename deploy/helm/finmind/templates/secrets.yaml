apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finmind.fullname" . }}-secrets
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
  annotations:
    # For use with external-secrets or sealed-secrets:
    # sealedsecrets.bitnami.com/managed: "true"
    # externalsecrets.kubernetes-client.io/managed: "true"
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.env.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "finmind" | quote }}
  POSTGRES_DB: {{ .Values.postgres.env.POSTGRES_DB | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "change-me" | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | default "" | quote }}
