{{- if .Values.networkPolicy.enabled | default false }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finmind.fullname" . }}-backend
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "finmind.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "finmind.nginx.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.backend.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "finmind.postgres.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.postgres.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "finmind.redis.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.redis.port }}
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finmind.fullname" . }}-postgres
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "finmind.postgres.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "finmind.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.postgres.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finmind.fullname" . }}-redis
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      {{- include "finmind.redis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "finmind.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.redis.port }}
{{- end }}
