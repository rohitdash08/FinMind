apiVersion: v1
kind: ConfigMap
metadata:
  name: finmind-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  GEMINI_MODEL: {{ .Values.backend.env.GEMINI_MODEL | quote }}
  REDIS_URL: {{ include "finmind.redisUrl" . | quote }}
  VITE_API_URL: "https://{{ .Values.ingress.hosts.api }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream backend_servers {
      server backend:8000;
    }

    server {
      listen 80;
      server_name _;

      location / {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
      }

      location /nginx_status {
        stub_status;
        allow all;
      }

      location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
      }
    }
