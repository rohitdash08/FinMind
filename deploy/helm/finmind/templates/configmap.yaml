{{- $fullName := include "finmind.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-config
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | default "INFO" | quote }}
  GEMINI_MODEL: {{ .Values.backend.env.GEMINI_MODEL | default "gemini-1.5-flash" | quote }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: "redis://{{ $fullName }}-redis-master:6379/0"
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-nginx
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream backend {
      server {{ $fullName }}-backend:{{ .Values.backend.service.port }};
    }

    server {
      listen 80;
      server_name _;

      # Health check endpoint
      location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
      }

      # Proxy to backend
      location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
      }

      # Metrics endpoint
      location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
      }
    }
