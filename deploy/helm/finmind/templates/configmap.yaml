apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finmind.configMapName" . }}
  namespace: {{ include "finmind.namespace" . }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  GEMINI_MODEL: {{ .Values.config.geminiModel | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  DATABASE_URL: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "finmind.postgresql.serviceName" . }}:{{ .Values.postgresql.service.port }}/$(POSTGRES_DB)"
