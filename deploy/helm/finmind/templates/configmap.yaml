apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finmind.fullname" . }}-config
  namespace: {{ .Values.namespaceOverride }}
data:
  LOG_LEVEL: {{ .Values.backend.env.logLevel | quote }}
  GEMINI_MODEL: {{ .Values.backend.env.geminiModel | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.env.corsAllowedOrigins | quote }}
  REDIS_URL: redis://{{ include "finmind.fullname" . }}-redis:6379/0
  FINMIND_API_URL: {{ .Values.frontend.env.apiUrl | quote }}
