# render.yaml — Render Blueprint
# Docs: https://docs.render.com/blueprint-spec
services:
  # ── Backend ──────────────────────────────────────────────────────────────
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    dockerContext: .
    repo: https://github.com/rohitdash08/FinMind
    branch: main
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finmind-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    startCommand: >-
      sh -c 'python -m flask --app wsgi:app init-db &&
      export PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc &&
      rm -rf $PROMETHEUS_MULTIPROC_DIR && mkdir -p $PROMETHEUS_MULTIPROC_DIR &&
      gunicorn --workers=2 --threads=4 --bind 0.0.0.0:$PORT wsgi:app'

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: finmind-frontend
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: app/dist
    repo: https://github.com/rohitdash08/FinMind
    branch: main
    plan: free
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: finmind-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: "20"

databases:
  - name: finmind-db
    plan: free
    databaseName: finmind
    user: finmind
    region: oregon
    postgresMajorVersion: "16"

  - name: finmind-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
