# DigitalOcean App Platform specification
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
spec:
  name: finmind
  region: nyc

  services:
    - name: backend
      github:
        repo: rohitdash08/FinMind
        branch: main
        deploy_on_push: true
      dockerfile_path: packages/backend/Dockerfile
      http_port: 8000
      instance_count: 1
      instance_size_slug: basic-xxs
      health_check:
        http_path: /health
        initial_delay_seconds: 15
        period_seconds: 10
        timeout_seconds: 5
        failure_threshold: 3
      routes:
        - path: /api
        - path: /health
        - path: /metrics
        - path: /auth
        - path: /expenses
        - path: /bills
        - path: /reminders
        - path: /insights
        - path: /categories
        - path: /docs
      envs:
        - key: DATABASE_URL
          scope: RUN_TIME
          value: ${db.DATABASE_URL}
        - key: REDIS_URL
          scope: RUN_TIME
          value: ${redis.REDIS_URL}
        - key: JWT_SECRET
          scope: RUN_TIME
          type: SECRET
          value: CHANGE_ME
        - key: LOG_LEVEL
          scope: RUN_TIME
          value: INFO
        - key: GEMINI_MODEL
          scope: RUN_TIME
          value: gemini-1.5-flash
        - key: GEMINI_API_KEY
          scope: RUN_TIME
          type: SECRET
          value: ""
      run_command: >-
        sh -c 'python -m flask --app wsgi:app init-db &&
        export PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc &&
        rm -rf $PROMETHEUS_MULTIPROC_DIR && mkdir -p $PROMETHEUS_MULTIPROC_DIR &&
        gunicorn --workers=2 --threads=4 --bind 0.0.0.0:8000 wsgi:app'

    - name: frontend
      github:
        repo: rohitdash08/FinMind
        branch: main
        deploy_on_push: true
      dockerfile_path: app/Dockerfile
      http_port: 80
      instance_count: 1
      instance_size_slug: basic-xxs
      health_check:
        http_path: /
      routes:
        - path: /
      envs:
        - key: VITE_API_URL
          scope: BUILD_TIME
          value: ${backend.PUBLIC_URL}

  databases:
    - name: db
      engine: PG
      version: "16"
      size: db-s-dev-database
      num_nodes: 1

    - name: redis
      engine: REDIS
      version: "7"
      size: db-s-dev-database
      num_nodes: 1

  alerts:
    - rule: DEPLOYMENT_FAILED
    - rule: DOMAIN_FAILED
