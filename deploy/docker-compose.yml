version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build: ../backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/finmind
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=super-secret
    depends_on:
      - db
      - redis

volumes:
  db-data:
  redis-data: