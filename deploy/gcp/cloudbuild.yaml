steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/finmind-backend:$COMMIT_SHA', '-f', 'packages/backend/Dockerfile', 'packages/backend']

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/finmind-frontend:$COMMIT_SHA', '-f', 'app/Dockerfile', 'app']

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/finmind-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/finmind-frontend:$COMMIT_SHA']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'finmind-backend'
      - '--image=gcr.io/$PROJECT_ID/finmind-backend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--port=8000'
      - '--allow-unauthenticated'
      - '--set-env-vars=LOG_LEVEL=INFO,GEMINI_MODEL=gemini-1.5-flash'
      - '--update-secrets=DATABASE_URL=finmind-database-url:latest,REDIS_URL=finmind-redis-url:latest,JWT_SECRET=finmind-jwt-secret:latest'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--cpu=1'
      - '--memory=512Mi'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'finmind-frontend'
      - '--image=gcr.io/$PROJECT_ID/finmind-frontend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--port=80'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--cpu=1'
      - '--memory=256Mi'

substitutions:
  _REGION: us-east1

images:
  - 'gcr.io/$PROJECT_ID/finmind-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/finmind-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
