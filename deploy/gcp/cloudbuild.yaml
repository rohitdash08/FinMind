# FinMind — GCP Cloud Build
# ──────────────────────────
# Deploy:
#   gcloud builds submit --config deploy/gcp/cloudbuild.yaml .
#
# Prerequisites:
#   - Enable Cloud Build, Cloud Run, Artifact Registry APIs
#   - Create Artifact Registry repo: gcloud artifacts repositories create finmind --repository-format=docker --location=us-central1

steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-backend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-backend:latest'
      - '-f'
      - 'packages/backend/Dockerfile'
      - 'packages/backend'
    id: 'build-backend'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-frontend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-frontend:latest'
      - '-f'
      - 'app/Dockerfile'
      - 'app'
    id: 'build-frontend'

  # Push backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-backend']
    waitFor: ['build-backend']

  # Push frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-frontend']
    waitFor: ['build-frontend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'finmind-backend'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-backend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8000'
      - '--allow-unauthenticated'
      - '--set-env-vars=GEMINI_MODEL=gemini-1.5-flash,LOG_LEVEL=INFO'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--memory=512Mi'
      - '--cpu=1'
    waitFor: ['build-backend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'finmind-frontend'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-frontend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=80'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--memory=256Mi'
      - '--cpu=1'
    waitFor: ['build-frontend']

substitutions:
  _REGION: us-central1
  _REPO: finmind

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-backend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/finmind-frontend:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
