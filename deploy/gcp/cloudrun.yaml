apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finmind-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: finmind-backend@PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: ghcr.io/rohitdash08/finmind-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: GEMINI_MODEL
          value: gemini-1.5-flash
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: finmind-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: finmind-secrets
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: finmind-secrets
              key: JWT_SECRET
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
