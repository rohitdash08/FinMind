# Azure Container Apps Configuration
# Deploy: az containerapp create --yaml deploy/azure/container-app.yaml

location: eastus
name: finmind-backend
resourceGroup: finmind-rg
type: Microsoft.App/containerApps

properties:
  managedEnvironmentId: /subscriptions/SUBSCRIPTION_ID/resourceGroups/finmind-rg/providers/Microsoft.App/managedEnvironments/finmind-env
  
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      transport: auto
      allowInsecure: false
    secrets:
      - name: database-url
        value: postgresql://...
      - name: redis-url
        value: redis://...
      - name: jwt-secret
        value: your-jwt-secret
      - name: gemini-api-key
        value: your-gemini-key
    
  template:
    containers:
      - name: finmind-backend
        image: finmindregistry.azurecr.io/finmind-backend:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            secretRef: database-url
          - name: REDIS_URL
            secretRef: redis-url
          - name: JWT_SECRET
            secretRef: jwt-secret
          - name: GEMINI_API_KEY
            secretRef: gemini-api-key
          - name: LOG_LEVEL
            value: INFO
          - name: GEMINI_MODEL
            value: gemini-1.5-flash
        probes:
          - type: Liveness
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          - type: Readiness
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
    
    scale:
      minReplicas: 0
      maxReplicas: 5
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "100"
