# =============================================================================
# FinMind — Google Cloud Run Service Definition
# =============================================================================
# This file defines the Cloud Run service configuration.
#
# Setup:
#   1. Install gcloud CLI and authenticate
#   2. Enable required APIs:
#      gcloud services enable run.googleapis.com sqladmin.googleapis.com redis.googleapis.com
#   3. Create Cloud SQL PostgreSQL instance:
#      gcloud sql instances create finmind-db --database-version=POSTGRES_16 \
#        --tier=db-f1-micro --region=us-central1
#      gcloud sql databases create finmind --instance=finmind-db
#      gcloud sql users set-password postgres --instance=finmind-db --password=<password>
#   4. Create Memorystore Redis:
#      gcloud redis instances create finmind-redis --size=1 --region=us-central1
#   5. Build and push:
#      gcloud builds submit --tag gcr.io/$PROJECT_ID/finmind-backend \
#        --build-arg DOCKERFILE=deploy/docker/backend.Dockerfile
#   6. Deploy:
#      gcloud run services replace deploy/platforms/gcp/app.yaml
#
# Environment variables containing secrets should be stored in
# Google Secret Manager and referenced via secretKeyRef.
# =============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finmind-backend
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Auto-scaling configuration
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        # Cloud SQL connection
        run.googleapis.com/cloudsql-instances: "PROJECT_ID:us-central1:finmind-db"
        # CPU allocation: always allocated (not throttled between requests)
        run.googleapis.com/cpu-throttling: "false"
        # Startup CPU boost for faster cold starts
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: finmind-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/finmind-backend:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GUNICORN_BIND
              value: "0.0.0.0:8080"
            - name: LOG_LEVEL
              value: "INFO"
            - name: GEMINI_MODEL
              value: "gemini-1.5-flash"
            # Secrets from Secret Manager
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finmind-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: finmind-redis-url
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finmind-jwt-secret
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
