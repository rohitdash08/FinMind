apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finmind-backend
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cloudsql-instances: "PROJECT_ID:REGION:finmind-db"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: finmind-backend@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: ghcr.io/rohitdash08/finmind-backend:latest
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: GEMINI_MODEL
              value: gemini-1.5-flash
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
          envFrom:
            - secretRef:
                name: finmind-secrets
                localObjectReference:
                  name: finmind-secrets
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          command:
            - sh
            - -c
            - |
              python -m flask --app wsgi:app init-db &&
              rm -rf $PROMETHEUS_MULTIPROC_DIR && mkdir -p $PROMETHEUS_MULTIPROC_DIR &&
              exec gunicorn --workers=2 --threads=4 --bind 0.0.0.0:8000 wsgi:app
