# DigitalOcean App Platform Spec
# Deploy: doctl apps create --spec deploy/platforms/digitalocean/app-platform/do-app-spec.yaml
name: finmind
region: nyc
services:
  - name: backend
    dockerfile_path: packages/backend/Dockerfile
    source_dir: /
    github:
      repo: rohitdash08/FinMind
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: "${db.DATABASE_URL}"
      - key: REDIS_URL
        scope: RUN_TIME
        value: "${redis.REDIS_URL}"
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-1.5-flash
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO
    routes:
      - path: /api

  - name: frontend
    dockerfile_path: app/Dockerfile
    source_dir: /app
    github:
      repo: rohitdash08/FinMind
      branch: main
      deploy_on_push: true
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
    routes:
      - path: /

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1

  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
