# FinMind - DigitalOcean App Platform Spec
# Usage: doctl apps create --spec deploy/platforms/digitalocean/app-spec.yaml

name: finmind
region: nyc

services:
  - name: backend
    dockerfile_path: packages/backend/Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: "${db.DATABASE_URL}"
      - key: REDIS_URL
        scope: RUN_TIME
        value: "${redis.REDIS_URL}"
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "change-me"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: "INFO"

  - name: frontend
    dockerfile_path: app/Dockerfile
    source_dir: /
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1

  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
