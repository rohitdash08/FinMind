# =============================================================================
# FinMind — Netlify Configuration (Frontend Only)
# =============================================================================
# Netlify is used to deploy the React SPA frontend.
# The backend must be deployed separately on another platform.
#
# Setup:
#   1. Install Netlify CLI: npm i -g netlify-cli
#   2. netlify login
#   3. netlify init (or connect via Netlify dashboard)
#   4. Set environment variable in Netlify dashboard:
#      VITE_API_URL = https://your-backend-url.com
#   5. Deploy:
#      netlify deploy --prod
#
# Netlify automatically provisions TLS and CDN.
# =============================================================================

[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA redirect — all routes fall through to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy API requests to the backend (avoids CORS in production)
[[redirects]]
  from = "/api/*"
  to = "https://your-finmind-backend.com/:splat"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache hashed static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
