# FinMind — Netlify configuration (frontend static site)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  base    = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION  = "10"

# API proxy — avoids CORS and hides the backend URL
[[redirects]]
  from   = "/api/*"
  to     = "https://finmind-backend.your-domain.com/:splat"
  status = 200
  force  = true

  [redirects.headers]
    X-From = "netlify"

# SPA fallback — all routes go to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://finmind-backend.your-domain.com"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "npm ci && npm run build"

  [context.production.environment]
    VITE_ENV = "production"

[context.deploy-preview]
  command = "npm ci && npm run build"

  [context.deploy-preview.environment]
    VITE_ENV = "preview"
