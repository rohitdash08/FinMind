# FinMind — Render Blueprint
# Deploy: https://render.com/deploy (point to this file)
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------------------
  # Backend API
  # -------------------------------------------------------------------------
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: ./packages/backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finmind-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false   # set in Render dashboard
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: PORT
        value: "8000"
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70

  # -------------------------------------------------------------------------
  # Frontend (static site build)
  # -------------------------------------------------------------------------
  - type: web
    name: finmind-frontend
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: ./app/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: finmind-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# -------------------------------------------------------------------------
# PostgreSQL database
# -------------------------------------------------------------------------
databases:
  - name: finmind-db
    databaseName: finmind
    user: finmind
    plan: starter
    region: oregon

# -------------------------------------------------------------------------
# Redis cache
# -------------------------------------------------------------------------
  - name: finmind-redis
    type: redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
