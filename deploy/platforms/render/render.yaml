# FinMind Backend - Render Blueprint
# Usage: Connect repo on render.com, it auto-detects this file
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    dockerContext: packages/backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: finmind-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GUNICORN_WORKERS
        value: "2"
      - key: LOG_LEVEL
        value: "INFO"

  - type: web
    name: finmind-frontend
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: app/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: finmind-db
    plan: free
    databaseName: finmind
    user: finmind

  - name: finmind-redis
    plan: free
    type: redis
