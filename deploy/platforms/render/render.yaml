## Render Blueprint — FinMind full stack
## Deploy: Link this repo in Render Dashboard → "New Blueprint"

services:
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: ./packages/backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: PROMETHEUS_MULTIPROC_DIR
        value: /tmp/prometheus_multiproc
      - key: POSTGRES_USER
        fromDatabase:
          name: finmind-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: finmind-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: finmind-db
          property: database
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finmind-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
    startCommand: >
      sh -c "python -m flask --app wsgi:app init-db &&
      rm -rf $PROMETHEUS_MULTIPROC_DIR && mkdir -p $PROMETHEUS_MULTIPROC_DIR &&
      exec gunicorn --workers=2 --threads=4 --bind 0.0.0.0:$PORT wsgi:app"

  - type: web
    name: finmind-frontend
    runtime: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    plan: starter
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: finmind-backend
          property: host

databases:
  - name: finmind-db
    databaseName: finmind
    user: finmind
    plan: starter

  - name: finmind-redis
    type: redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
