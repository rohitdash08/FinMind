# =============================================================================
# FinMind — Render Blueprint (render.yaml)
# =============================================================================
# Render uses this file for Infrastructure as Code deployments.
#
# Setup:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" and connect your repo
#   4. Render will auto-detect this file and create all services
#   5. Set secret environment variables in the Render dashboard
#
# Render automatically manages TLS certificates and provides a .onrender.com
# domain for each web service.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: deploy/docker/backend.Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: finmind-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false  # Set manually in dashboard
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70

  # ---------------------------------------------------------------------------
  # Frontend SPA
  # ---------------------------------------------------------------------------
  - type: web
    name: finmind-frontend
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: app/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: finmind-backend
          type: web
          property: url

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  - type: redis
    name: finmind-redis
    plan: starter
    ipAllowList: []  # Allow only internal access
    maxmemoryPolicy: allkeys-lru

databases:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  - name: finmind-db
    plan: starter
    databaseName: finmind
    user: finmind
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []  # Allow only internal access
