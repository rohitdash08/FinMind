name: finmind
region: nyc
services:
  - name: backend
    dockerfile_path: packages/backend/Dockerfile
    source_dir: packages/backend
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET

  - name: frontend
    dockerfile_path: app/Dockerfile
    source_dir: app
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: VITE_API_URL
        scope: RUN_TIME
        value: ${backend.PUBLIC_URL}

databases:
  - name: finmind-db
    engine: PG
    version: "16"
    size: db-s-dev-database

  - name: finmind-redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
