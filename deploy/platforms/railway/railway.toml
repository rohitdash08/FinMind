[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/backend/Dockerfile"

[deploy]
startCommand = "sh -c 'python -m flask --app wsgi:app init-db && gunicorn --workers=2 --threads=4 --bind 0.0.0.0:$PORT wsgi:app'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[services]]
name = "backend"
source = "packages/backend"

[[services]]
name = "frontend"
source = "app"
builder = "DOCKERFILE"
