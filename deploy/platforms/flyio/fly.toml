# FinMind Backend - Fly.io Configuration
# Usage:
#   fly launch --config deploy/platforms/flyio/fly.toml
#   fly postgres create --name finmind-db
#   fly postgres attach finmind-db
#   fly redis create --name finmind-redis
#   fly deploy

app = "finmind-backend"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "packages/backend/Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  GUNICORN_WORKERS = "2"
  GUNICORN_THREADS = "4"
  GEMINI_MODEL = "gemini-1.5-flash"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
