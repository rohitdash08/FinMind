services:
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: ./packages/backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: finmind-redis
          type: redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: finmind-frontend
    runtime: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    envVars:
      - key: VITE_API_URL
        fromService:
          name: finmind-backend
          type: web
          property: host
    autoDeploy: true

  - type: redis
    name: finmind-redis
    plan: free

databases:
  - name: finmind-db
    plan: free
