# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: finmind-backend
    runtime: docker
    dockerfilePath: packages/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmind-db
          property: connectionURI
      - key: REDIS_URL
        fromService:
          type: redis
          name: finmind-redis
          property: connectionURI
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: finmind-frontend
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: app/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: finmind-db
    plan: free
    databaseName: finmind
    user: finmind

  - name: finmind-redis
    plan: free
    type: redis
