# DigitalOcean App Platform specification
name: finmind
region: nyc

services:
  - name: backend
    dockerfile_path: packages/backend/Dockerfile
    github:
      repo: rohitdash08/FinMind
      branch: main
      deploy_on_push: true
    health_check:
      http_path: /health
    http_port: 8000
    instance_count: 2
    instance_size_slug: basic-xxs
    routes:
      - path: /api
    envs:
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        
  - name: frontend
    dockerfile_path: app/Dockerfile
    github:
      repo: rohitdash08/FinMind
      branch: main
      deploy_on_push: true
    http_port: 80
    instance_count: 2
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: /api

databases:
  - name: db
    engine: PG
    production: false
    version: "16"
    
  - name: redis
    engine: REDIS
    production: false
    version: "7"
