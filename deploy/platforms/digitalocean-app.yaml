# DigitalOcean App Platform spec
# Deploy: doctl apps create --spec deploy/platforms/digitalocean-app.yaml
name: finmind
region: nyc
services:
  - name: backend
    dockerfile_path: packages/backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: change-me
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO
  - name: frontend
    dockerfile_path: app/Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
