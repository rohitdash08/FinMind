# =============================================================================
# FinMind — Fly.io Deployment Configuration
# =============================================================================
# Fly.io uses this file to configure the application deployment.
#
# Setup:
#   1. Install flyctl: curl -L https://fly.io/install.sh | sh
#   2. fly auth login
#   3. fly apps create finmind-backend
#   4. Create a Postgres cluster:
#      fly postgres create --name finmind-db
#      fly postgres attach finmind-db --app finmind-backend
#   5. Create a Redis instance:
#      fly redis create --name finmind-redis
#   6. Set secrets:
#      fly secrets set JWT_SECRET="$(openssl rand -hex 32)" --app finmind-backend
#      fly secrets set REDIS_URL="<redis-url-from-step-5>" --app finmind-backend
#   7. Deploy:
#      fly deploy --config deploy/platforms/fly/fly.toml
#
# For the frontend, deploy separately:
#   fly apps create finmind-frontend
#   fly deploy --config deploy/platforms/fly/fly-frontend.toml
# =============================================================================

app = "finmind-backend"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "deploy/docker/backend.Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  GEMINI_MODEL = "gemini-1.5-flash"
  GUNICORN_WORKERS = "2"
  GUNICORN_THREADS = "4"
  GUNICORN_BIND = "0.0.0.0:8080"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 8080
  path = "/metrics"

[deploy]
  strategy = "rolling"
  release_command = "python -m flask --app wsgi:app init-db"
