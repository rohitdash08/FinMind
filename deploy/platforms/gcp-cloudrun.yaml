# GCP Cloud Run service definition
# Deploy:
#   gcloud builds submit --tag gcr.io/$PROJECT_ID/finmind-backend packages/backend
#   gcloud run services replace deploy/platforms/gcp-cloudrun.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finmind-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/finmind-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: GEMINI_MODEL
              value: gemini-1.5-flash
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
