apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: finmind-backend
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/us-central1/connectors/finmind-connector
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/finmind-backend:latest
        ports:
        - name: http1
          containerPort: 8000
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: finmind-database-url
              key: latest
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: finmind-redis-url
              key: latest
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: finmind-jwt-secret
              key: latest
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
  traffic:
  - percent: 100
    latestRevision: true
