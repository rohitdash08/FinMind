# FinMind — Railway Configuration
# Deploy: `railway up` from project root
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/backend/Dockerfile"

[deploy]
startCommand = "sh -c 'python -m flask --app wsgi:app init-db && gunicorn --workers=2 --threads=4 --bind 0.0.0.0:$PORT wsgi:app'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "backend"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "packages/backend/Dockerfile"

[services.deploy]
startCommand = "sh -c 'python -m flask --app wsgi:app init-db && gunicorn --workers=2 --threads=4 --bind 0.0.0.0:$PORT wsgi:app'"
healthcheckPath = "/health"

[[services]]
name = "frontend"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "app/Dockerfile"
