[build]
builder = "DOCKERFILE"

[build.backend]
dockerfilePath = "packages/backend/Dockerfile"
buildContext = "."

[build.frontend]
dockerfilePath = "app/Dockerfile"
buildContext = "app"

[deploy]
numReplicas = 1
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
