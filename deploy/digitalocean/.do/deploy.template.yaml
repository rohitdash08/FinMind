spec:
  name: finmind
  services:
  - dockerfile_path: packages/backend/Dockerfile
    git:
      branch: main
      repo_clone_url: https://github.com/rohitdash08/FinMind.git
    health_check:
      http_path: /health
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    name: backend
    envs:
    - key: DATABASE_URL
      value: ${db.DATABASE_URL}
    - key: REDIS_URL
      value: ${redis.REDIS_URL}
    - key: JWT_SECRET
      type: SECRET
      value: change-me-to-random
    - key: GEMINI_API_KEY
      type: SECRET
      value: ""
    - key: LOG_LEVEL
      value: INFO
  databases:
  - engine: PG
    name: db
    production: true
    version: "16"
