# FinMind — DigitalOcean App Platform
# Deploy:
#   doctl apps create --spec deploy/digitalocean/.do/app.yaml
# Or import via DO dashboard → Apps → Create App → From Spec

name: finmind
region: nyc

services:
  - name: backend
    dockerfile_path: packages/backend/Dockerfile
    github:
      repo: your-org/FinMind
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-1.5-flash
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO
    run_command: |
      sh -c 'python -m flask --app wsgi:app init-db && gunicorn --workers=2 --threads=4 --bind 0.0.0.0:8000 wsgi:app'

  - name: frontend
    dockerfile_path: app/Dockerfile
    github:
      repo: your-org/FinMind
      branch: main
      deploy_on_push: true
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1

  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
