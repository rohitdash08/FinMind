alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
databases:
- engine: PG
  name: finmind-db
  production: true
  version: "16"
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: finmind-backend
    match:
      path:
        prefix: "/"
name: finmind
region: nyc
services:
- build:
    dockerfile_path: packages/backend/Dockerfile
  health_check:
    http_path: /health
  http_port: 8000
  instance_count: 1
  instance_size_slug: basic-xxs
  name: finmind-backend
  source_dir: /
