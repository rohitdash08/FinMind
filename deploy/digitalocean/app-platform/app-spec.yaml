name: finmind
region: nyc
features:
  - buildpack-stack=ubuntu-22

databases:
  - name: finmind-db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
  - name: finmind-redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1

services:
  - name: finmind-api
    dockerfile_path: packages/backend/Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 15
    run_command: |
      sh -c 'python -m flask --app wsgi:app init-db && gunicorn -w 2 -k gthread -b 0.0.0.0:8000 wsgi:app'
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${finmind-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${finmind-redis.REDIS_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO

static_sites:
  - name: finmind-web
    source_dir: app
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${finmind-api.PUBLIC_URL}
