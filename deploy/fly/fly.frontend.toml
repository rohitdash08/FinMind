app = "__FRONTEND_APP__"
primary_region = "sjc"

[build]
  dockerfile = "app/Dockerfile"

[env]
  FINMIND_API_URL = "__BACKEND_URL__"

[[services]]
  internal_port = 80
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
