app = "__BACKEND_APP__"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.fullstack"

[env]
  LOG_LEVEL = "INFO"
  GEMINI_MODEL = "gemini-1.5-flash"

[deploy]
  release_command = "python -m flask --app wsgi:app init-db"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health/ready"
