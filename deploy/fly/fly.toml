# Fly.io Configuration for FinMind Backend
# Deploy: flyctl launch --config deploy/fly/fly.toml

app = "finmind-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "packages/backend/Dockerfile"

[deploy]
  release_command = "python -m flask --app wsgi:app init-db"

[env]
  LOG_LEVEL = "INFO"
  GEMINI_MODEL = "gemini-1.5-flash"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[metrics]
  port = 8000
  path = "/metrics"
