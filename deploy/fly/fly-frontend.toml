# FinMind Frontend — Fly.io Configuration
# ──────────────────────────────────────
# Deploy:
#   fly launch --name finmind-frontend --config deploy/fly/fly-frontend.toml --no-deploy
#   fly deploy --config deploy/fly/fly-frontend.toml --dockerfile app/Dockerfile

app = "finmind-frontend"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "app/Dockerfile"

  [build.args]
    VITE_API_URL = "https://finmind-backend.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
