{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: finmind-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: finmind
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  POSTGRES_USER: {{ "finmind" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | b64enc | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
  GRAFANA_ADMIN_USER: {{ .Values.secrets.grafanaAdminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
{{- end }}
