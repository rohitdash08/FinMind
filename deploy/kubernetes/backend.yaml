apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: finmind
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://finmind:changeme-in-production@postgres:5432/finmind
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: changeme-generate-a-real-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: finmind
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
      - name: backend
        image: finmind/backend:latest
        ports: [{ containerPort: 8000 }]
        envFrom: [{ secretRef: { name: backend-secret } }]
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests: { memory: "256Mi", cpu: "250m" }
          limits: { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: finmind
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: finmind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
