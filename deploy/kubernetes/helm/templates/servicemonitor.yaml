{{- if .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: finmind-backend
  endpoints:
    - port: "8000"
      path: /metrics
      interval: 30s
{{- end }}
