apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finmind.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
data:
  DATABASE_URL: "postgresql+psycopg2://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "finmind.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
  REDIS_URL: "redis://{{ include "finmind.fullname" . }}-redis:6379/0"
  POSTGRES_USER: "{{ .Values.postgresql.auth.username }}"
  POSTGRES_DB: "{{ .Values.postgresql.auth.database }}"
  LOG_LEVEL: "{{ .Values.backend.env.LOG_LEVEL }}"
  VITE_API_URL: "/api"
