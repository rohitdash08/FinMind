{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finmind.fullname" . }}-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "finmind.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
    protocol: TCP
  selector:
    app.kubernetes.io/component: database
    {{- include "finmind.selectorLabels" . | nindent 4 }}
{{- end }}
