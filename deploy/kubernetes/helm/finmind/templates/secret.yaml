apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finmind.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "finmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: "{{ .Values.postgresql.auth.password }}"
  JWT_SECRET: "{{ .Values.backend.secrets.JWT_SECRET | default "change-me-in-production" }}"
  OPENAI_API_KEY: "{{ .Values.backend.secrets.OPENAI_API_KEY }}"
  GEMINI_API_KEY: "{{ .Values.backend.secrets.GEMINI_API_KEY }}"
  GEMINI_MODEL: "gemini-1.5-flash"
  TWILIO_ACCOUNT_SID: "{{ .Values.backend.secrets.TWILIO_ACCOUNT_SID }}"
  TWILIO_AUTH_TOKEN: "{{ .Values.backend.secrets.TWILIO_AUTH_TOKEN }}"
  TWILIO_WHATSAPP_FROM: "{{ .Values.backend.secrets.TWILIO_WHATSAPP_FROM }}"
  EMAIL_FROM: "{{ .Values.backend.secrets.EMAIL_FROM }}"
  SMTP_URL: "{{ .Values.backend.secrets.SMTP_URL }}"
