# Default values for FinMind Helm chart

# Global settings
global:
  imagePullPolicy: IfNotPresent
  storageClass: standard

# Namespace
namespace: finmind

# PostgreSQL configuration
postgresql:
  enabled: true
  image: postgres:16
  auth:
    username: finmind
    password: finmind
    database: finmind
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Redis configuration
redis:
  enabled: true
  image: redis:7-alpine
  persistence:
    enabled: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Backend configuration
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: finmind/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    LOG_LEVEL: INFO
  # Secrets should be created separately
  secrets:
    JWT_SECRET: ""
    OPENAI_API_KEY: ""
    GEMINI_API_KEY: ""
    TWILIO_ACCOUNT_SID: ""
    TWILIO_AUTH_TOKEN: ""
    TWILIO_WHATSAPP_FROM: ""
    EMAIL_FROM: ""
    SMTP_URL: ""

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: finmind/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: finmind.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend
  tls:
    - secretName: finmind-tls
      hosts:
        - finmind.example.com

# ServiceMonitor for Prometheus observability
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# NetworkPolicy
networkPolicy:
  enabled: false

# PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
