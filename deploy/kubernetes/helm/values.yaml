# FinMind Helm Chart Values
replicaCount:
  backend: 2
  frontend: 2

image:
  backend:
    repository: finmind/backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: finmind/frontend
    tag: latest
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "20"
  hosts:
    - host: finmind.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: finmind-tls
      hosts: [finmind.example.com]

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  backend:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  frontend:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

postgresql:
  enabled: true
  auth:
    username: finmind
    database: finmind
    existingSecret: finmind-db-secret
  primary:
    persistence: { size: 10Gi }

redis:
  enabled: true
  auth: { enabled: false }
  master:
    persistence: { size: 1Gi }

secrets:
  databaseUrl: ""
  redisUrl: ""
  secretKey: ""

monitoring:
  enabled: true
  serviceMonitor: true
