# =============================================================================
# FinMind — Production Reverse Proxy Configuration
# =============================================================================
# Routes /api/* to backend, everything else to frontend SPA.
# Handles WebSocket upgrades, proxy headers, and rate limiting.
# =============================================================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

# Rate limiting zone — 10 req/s per IP for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS in production (uncomment when TLS is configured)
    # return 301 https://$host$request_uri;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------------
    # Backend API — proxy /api/* requests to the Flask backend
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # Strip /api prefix so the backend sees clean paths
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Direct access to health and metrics (no /api prefix needed)
    location = /health {
        proxy_pass http://backend_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://backend_upstream/metrics;
        proxy_set_header Host $host;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Frontend SPA — everything else goes to the React app
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # Nginx status for monitoring
    # -----------------------------------------------------------------------
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
    }
}

