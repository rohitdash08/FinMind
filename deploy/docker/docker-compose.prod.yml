# =============================================================================
# FinMind — Production Docker Compose
# =============================================================================
# Usage:
#   cp .env.example .env   # edit secrets
#   docker compose -f deploy/docker/docker-compose.prod.yml up -d --build
#
# Services: postgres, redis, backend, frontend, nginx-proxy
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - finmind-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    # Do not expose postgres to the host in production
    expose:
      - "5432"

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --save 60 1000
    volumes:
      - redisdata:/data
    networks:
      - finmind-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    expose:
      - "6379"

  # ---------------------------------------------------------------------------
  # Backend (Flask + Gunicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/backend.Dockerfile
    restart: always
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finmind-net
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend (Vite build served by nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../../
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: always
    networks:
      - finmind-net
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  # ---------------------------------------------------------------------------
  # Reverse Proxy — nginx routing frontend + backend under one host
  # ---------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${LISTEN_PORT:-80}:80"
      - "${LISTEN_PORT_TLS:-443}:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount TLS certs if available (optional — comment out if not using TLS)
      # - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem:/etc/nginx/ssl/cert.pem:ro
      # - /etc/letsencrypt/live/${DOMAIN}/privkey.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - backend
      - frontend
    networks:
      - finmind-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  finmind-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
