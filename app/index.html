<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinMind - AI-Powered Budget & Bill Tracking</title>
    <meta name="description" content="Transform your financial life with intelligent budget tracking, automated bill management, and AI-driven insights. Start your free trial today." />
    <meta name="author" content="FinMind Team" />
    <meta name="keywords" content="budget tracking, bill management, personal finance, AI financial insights, expense tracking, financial planning" />

    <meta property="og:title" content="FinMind - AI-Powered Financial Intelligence" />
    <meta property="og:description" content="Smart budget tracking and bill management with AI-powered insights to help you save more and stress less." />
    <meta property="og:type" content="website" />
  </head>
  <!-- FOUC prevention: apply stored theme before page renders -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem("finmind-theme") || "system";
        var resolved = stored === "dark" ? "dark"
          : stored === "light" ? "light"
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute("data-theme", resolved);
      } catch(e) {}
    })();
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
